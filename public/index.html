<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flores de Acho Online</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <h1>🌹 Flores de Acho Online</h1>
    <p class="tag">El Mercado de Flores de Acho, ahora a un clic.</p>
    <nav>
      <span id="who">No has iniciado sesión</span>
      <button id="btn-auth" type="button">Ingresar / Registrarme</button>
      <button id="btn-orders" type="button" hidden>Mis pedidos</button>
      <button id="btn-logout" type="button" hidden>Salir</button>
    </nav>
  </header>

  <main>
    <section class="catalog" aria-label="Catálogo">
      <form id="filters" class="filters">
        <input id="q" type="search" placeholder="Buscar: rosas rojas, girasol…" aria-label="Buscar">
        <select id="category" aria-label="Categoría"><option value="">Todas las categorías</option></select>
        <input id="maxPrice" type="number" min="1" step="1" placeholder="Precio máx. (S/)" aria-label="Precio máximo">
        <button type="submit">Buscar</button>
      </form>
      <div id="grid" class="grid" aria-live="polite"></div>
    </section>

    <aside class="cart" aria-label="Carrito">
      <h2>Tu carrito</h2>
      <ul id="cart-list"></ul>
      <p id="cart-empty">Aún no agregas productos.</p>
      <form id="checkout" hidden>
        <label>Distrito <select id="district" required></select></label>
        <p id="quote" class="hint"></p>
        <label>Dirección <input id="address" required minlength="5" maxlength="200"></label>
        <label>Fecha de entrega <input id="date" type="date" required></label>
        <label>Franja <select id="slot" required></select></label>
        <label>Mensaje para la tarjeta <input id="message" maxlength="200"></label>
        <p class="total">Total: <strong id="total">S/ 0.00</strong></p>
        <button type="submit">Confirmar pedido</button>
      </form>
      <p id="msg" role="status"></p>
    </aside>
  </main>

  <dialog id="auth-dialog">
    <form id="auth-form" method="dialog">
      <h2>Ingresa o crea tu cuenta</h2>
      <label>Nombre (solo registro) <input id="a-name" minlength="2"></label>
      <label>Correo <input id="a-email" type="email" required></label>
      <label>Contraseña (mín. 8) <input id="a-pass" type="password" minlength="8" required></label>
      <label>Soy <select id="a-role"><option value="cliente">Cliente</option><option value="comerciante">Comerciante</option></select></label>
      <p id="a-msg" class="error" role="alert"></p>
      <div class="row">
        <button id="a-login" type="submit" value="login">Ingresar</button>
        <button id="a-register" type="submit" value="register">Registrarme</button>
        <button id="a-cancel" type="button">Cerrar</button>
      </div>
    </form>
  </dialog>

  <dialog id="orders-dialog">
    <h2>Mis pedidos</h2>
    <ul id="orders-list"></ul>
    <button id="o-close" type="button">Cerrar</button>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
